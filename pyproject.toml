[project]
name = "rig-omniscout-l2"
version = "1.0.0"
description = "RIG Build Card Intelligence Engine — research to revenue in one nightly pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.0",
    "playwright>=1.60",
]

[project.optional-dependencies]
pattern = ["scipy", "networkx"]
build = ["pytest", "pydantic"]

[tool.setuptools.packages.find]
include = ["rig_omniscout*"]
